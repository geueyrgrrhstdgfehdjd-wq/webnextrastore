services:
  - type: web
    name: nextrastore
    runtime: node
    plan: starter
    region: singapore
    branch: main
    # 1. เพิ่ม npm rebuild better-sqlite3 ใน buildCommand
    buildCommand: npm install && npm rebuild better-sqlite3 && npm run seed
    startCommand: node server.js
    healthCheckPath: /
    disk:
      name: nextrastore-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /opt/render/project/src/data
      # 2. เพิ่ม NODE_VERSION เพื่อล็อกเวอร์ชัน Node ให้เสถียร
      - key: NODE_VERSION
        value: 20.10.0
