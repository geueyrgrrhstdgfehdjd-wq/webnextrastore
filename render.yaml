services:
  - type: web
    name: nextrastore
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    healthCheckPath: /
    disk:
      name: nextrastore-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /opt/render/project/src/data
